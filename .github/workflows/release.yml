name: Release validation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual runs from a branch validate metadata only. Dispatch from a tag
    # ref to also validate the annotated tag object and that it points to HEAD.

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code and tag objects
        uses: actions/checkout@v4
        with:
          # check-release verifies that an annotated tag resolves to HEAD.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate release metadata and tag
        run: composer check-release

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Check formatting
        run: composer format-test
