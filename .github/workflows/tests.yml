name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php81-smoke:
    runs-on: ubuntu-latest
    name: PHP 8.1 - runtime smoke (no dev dependencies)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Resolve production dependencies
        run: |
          runtime_manifest_backup="$RUNNER_TEMP/laravel-upgrades-rector-composer.json"
          cp composer.json "$runtime_manifest_backup"
          trap 'mv "$runtime_manifest_backup" composer.json' EXIT
          # Decode to objects, not arrays: an empty JSON object such as
          # config.allow-plugins would otherwise round-trip as [] and fail
          # Composer's schema validation.
          php -r '$path = "composer.json"; $manifest = json_decode((string) file_get_contents($path), false, 512, JSON_THROW_ON_ERROR); unset($manifest->{"require-dev"}, $manifest->{"autoload-dev"}); file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);'
          composer update --no-dev --prefer-dist --no-interaction --no-progress

      - name: Validate support policy and CLI bootstrap
        run: |
          php bin/check-support-policy
          php bin/laravel-upgrade --help

  # Full suite, including the rule and advisory suites that analyse real
  # framework sources. Those per-version trees are installed from committed
  # lock files whose transitive Symfony packages require the newest PHP, and
  # their contents do not vary with the host PHP — so analysing them once is
  # full coverage. Cross-version coverage lives in the `test` job below.
  test-envs:
    runs-on: ubuntu-latest
    name: PHP 8.4 - full suite (real framework environments)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Cache per-version framework environments
        uses: actions/cache@v4
        with:
          path: tests/env/laravel-*/vendor
          key: test-envs-${{ hashFiles('tests/env/laravel-*/composer.lock') }}

      - name: Install per-version framework environments
        run: composer setup-envs

      - name: Execute full test suite
        run: composer test

      - name: Execute static analysis
        run: composer analyse

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      # The framework-environment suites run once, in the test-envs job.
      # This matrix covers the environment-independent suite across every
      # supported PHP version and both dependency resolutions.
      - name: Execute environment-independent tests
        run: composer test-independent

      - name: Execute static analysis
        run: composer analyse
